# Nebula API: one hardened container behind the host's reverse proxy.
# Usage: copy .env.example to .env, set Jwt__SigningKey, then `docker compose up -d`.
name: nebula

services:
  api:
    image: ghcr.io/antryas/nebula-api:${NEBULA_TAG:-latest}
    build: .
    # Loopback only: the reverse proxy on the host is the single public entry point.
    ports:
      - "127.0.0.1:${NEBULA_PORT:-8080}:8080"
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
    # No healthcheck: the chiseled image has no shell or curl. Probe /health through the proxy.

networks:
  edge:
    # Fixed subnet so the gateway address (the source IP of proxied requests on
    # Docker Desktop) is predictable and can be trusted via ForwardedHeaders__KnownProxies__0.
    ipam:
      config:
        - subnet: 172.30.80.0/24
          gateway: 172.30.80.1
